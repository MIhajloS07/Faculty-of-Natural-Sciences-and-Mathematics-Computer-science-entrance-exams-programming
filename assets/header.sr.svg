<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" role="img" aria-label="PMF Computer Science entrance exams - programming" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"><animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#1e293b"><animate attributeName="stop-color" values="#1e293b;#312e81;#1e293b" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="typing">
      <rect x="60" y="150" width="0" height="40">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <!-- floating code symbols -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#94a3b8" opacity="0.35">
    <text x="90" y="60">{ }<animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5s" repeatCount="indefinite"/></text>
    <text x="300" y="235">#include<animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="6s" repeatCount="indefinite"/></text>
    <text x="560" y="55">O(n log n)<animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="7s" repeatCount="indefinite"/></text>
    <text x="760" y="215">for(;;)<animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="810" y="110">0101<animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="5.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- title -->
  <text x="60" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="url(#accent)">PMF · Prijemni ispit</text>
  <text x="60" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#cbd5e1">Računarske nauke — zadaci iz programiranja</text>

  <!-- typing line -->
  <g clip-path="url(#typing)" font-family="Consolas, 'Courier New', monospace" font-size="24">
    <text x="60" y="178" fill="#4ade80">$ ./resi_zadatak --prijemni</text>
  </g>
  <rect x="60" y="158" width="12" height="26" fill="#4ade80">
    <animate attributeName="x" values="60;700;700;60" keyTimes="0;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- animated underline -->
  <rect x="60" y="205" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;780;780;0" keyTimes="0;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
